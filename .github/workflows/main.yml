  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: python -m pip install --upgrade pip && pip install -r requirements.txt

  - name: Run generator
    env:
      PLANT: ${{ github.event.inputs.plant }}
      DOWNLOAD_IMAGE: ${{ github.event.inputs.download_image }}
      LENGTH: ${{ github.event.inputs.length }}
      VOICE: ${{ github.event.inputs.voice }}
    run: |
      ARGS="$PLANT --length $LENGTH --voice $VOICE"
      if [ "${DOWNLOAD_IMAGE,,}" = "true" ]; then
        ARGS="$ARGS --download-image"
      fi
      echo "Running: python plant_post_generator.py $ARGS"
      python plant_post_generator.py $ARGS || true

  - name: Upload generated files
    uses: actions/upload-artifact@v3
    with:
      name: plant-post
      path: |
        *.md
        *.jpg
        *.jpeg
        *.png
